spring:
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: false
  
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

# 배치 테스트용 설정
batch:
  chunk-size: 10
  retry-limit: 2
  skip-limit: 5
  grid-size: 2
  thread-pool:
    core-size: 2
    max-size: 2
    queue-capacity: 10

# 로그 레벨 설정
logging:
  level:
    com.wms: INFO
    org.springframework.batch: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
